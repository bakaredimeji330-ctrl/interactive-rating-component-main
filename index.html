<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
  <main class="wrapper">
    <section id="visible">
      <div class="img"><img src="./images/icon-star.svg" alt="Icon-star SVG"></div>
      
      <h2>How did we do?</h2>
      <p>Please let us know how we did with your support request. All feedback is appreciated 
        to help us improve our offering!</p>
        <div class="ratings">
          <button class="rating-btn" id='1'>1</button>
          <button class="rating-btn" id='2'>2</button>
          <button class="rating-btn" id='3'>3</button>
          <button class="rating-btn" id='4'>4</button>
          <button class="rating-btn" id='5'>5</button>
        </div>
        
        <button class="submit-btn">Submit</button>
    </section>

      <!-- Hidden class -->

      <section id="container2" class="hidden">
        <img src="./images/illustration-thank-you.svg" alt="thank you illustration">
        <span></span>



        <h2>Thank you!</h2>
        <p>We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
      </section>
  </main>

  

<script src="./index.js" defer></script>
</body>
</html>
