<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
<dv class="root">
  <div class="wrapper">
    <div class="container">
      <div class="normal">
      <div class="img"><img src="./images/icon-star.svg" ></div>
      
      <h2>How did we do?</h2>
      <p>Please let us know how we did with your support request. All feedback is appreciated 
        to help us improve our offering!</p>
        <div class="ratings">
          <button class="rating-btn">1</button>
          <button class="rating-btn">2</button>
          <button class="rating-btn">3</button>
          <button class="rating-btn">4</button>
          <button class="rating-btn">5</button>
        </div>
        
        <button class="btn">Submit</button>
      </div>

      <!--  -->

      <div class="thanks hidden">
        <img src="./images/illustration-thank-you.svg" alt="">
        


      </div>
    </div>
  </div>
</div>
  

<script src="./index.js"></script>
</body>
</html>
